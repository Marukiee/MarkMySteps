server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long cache (Vite emits hashed filenames).
    # `^~`: a hashed bundle keeps this block's immutable header rather than
    # falling into the regex location below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The one file that must never be cached.
    #
    # index.html carries the hashed names of the bundles, and it was served
    # without a Cache-Control header at all — so browsers applied their own
    # heuristic and kept it for hours or days. With the bundles it points at
    # marked immutable for a year, a phone that had opened the site once
    # stayed on that entire build: a share link opened there showed a version
    # of the page from before the last deploys. Revalidating this one file is
    # what makes a deploy arrive.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Unhashed public files (favicon, the flag sprites): cached for a week, not
    # forever — they are replaced under the same name when they change.
    location ~* \.(svg|png|ico|webmanifest|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # API → internal NestJS service. `^~` so a path that happens to end in one
    # of the extensions above is still proxied rather than looked for on disk.
    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Append the client IP; the API trusts exactly one proxy hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback. Every app route (including a /s/<slug> share link) is
    # answered with index.html from here, so this is where that file gets its
    # no-cache header as well — the internal rewrite never enters the
    # `location = /index.html` block above.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
