# The "back in a minute" page.
#
# Runs on the app's own port while the real containers are being replaced, so a
# deploy shows a MarkMySteps page instead of the browser's "site can't be
# reached". Every request is answered with a 503, which is the honest status:
# nothing here is the app, and no crawler or cache should treat it as though it
# were.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Never keep this page: the moment the app is back, the browser must ask
    # again rather than serve a cached apology.
    add_header Cache-Control "no-store" always;
    # A hint to anything that respects it (Cloudflare included) that this is
    # temporary, and roughly how long it will last.
    add_header Retry-After 30 always;

    # Real files, served as such: the tab icon and the two typefaces the page
    # is set in. Answering these with an HTML body only makes the browser ask
    # for them again, and leaves the page in a fallback font while it does.
    location ~ ^/(favicon\.svg|fraunces\.woff2|inter\.woff2)$ {
        try_files $uri =404;
    }

    # An app still open in somebody's tab must get a clean failure rather than
    # an HTML page where it is expecting JSON. `return` with a body of its own
    # is sent as it stands, so this never falls into the error page below.
    location ^~ /api/ {
        default_type application/json;
        return 503 '{"statusCode":503,"message":"MarkMySteps is even in onderhoud."}';
    }

    # Everything else, whatever the path: the page, with the 503 kept.
    location / {
        return 503;
    }

    location = /maintenance.html {
        internal;
    }

    error_page 503 /maintenance.html;
}
