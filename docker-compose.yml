# MarkMySteps — production deployment (Ubuntu + Cloudflare Tunnel)
#
# Security posture:
# - `db` has NO ports mapping: reachable only on the internal network.
# - Only `web` is exposed, and only on localhost — the Cloudflare Tunnel
#   (cloudflared) running on the host connects to 127.0.0.1:${WEB_PORT}.
# - Every service has CPU/memory limits so a leak can't take down the host.

name: markmysteps

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal
    ports:
      # Localhost only — cloudflared on the host proxies markmaaktmedia.nl here.
      # Port is configurable via WEB_PORT in .env (default 18790, deliberately
      # uncommon to avoid clashing with Home Assistant & friends).
      - '127.0.0.1:${WEB_PORT:-18790}:80'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

networks:
  internal:
    driver: bridge

volumes:
  db-data:
