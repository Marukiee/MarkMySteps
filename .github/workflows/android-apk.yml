name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-native/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the APK as a Release asset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # The native app (Compose) replaces the old web-wrapper app: same package, same key, a higher build number.
      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: apps/android-native
        env:
          MMS_RELEASE: 'true'
          MMS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MMS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MMS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MMS_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (fallback, unsigned)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: apps/android-native
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: markmysteps-apk
          path: apps/android-native/app/build/outputs/apk/**/*.apk
          retention-days: 30

      # Publish the signed APK as a GitHub Release under a stable asset name, so
      # the in-app update banner has a directly-downloadable URL:
      #   https://github.com/<owner>/<repo>/releases/latest/download/markmysteps.apk
      - name: Stage APK for release
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APK=$(find apps/android-native/app/build/outputs/apk -name '*-release.apk' | head -1)
          cp "$APK" "$RUNNER_TEMP/markmysteps.apk"
          # The updater checks the download against this sum before it installs anything.
          (cd "$RUNNER_TEMP" && sha256sum markmysteps.apk > markmysteps.apk.sha256)

      - name: Publish GitHub Release
        if: steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          # What is new in this build, a few short lines (apps/android-native/release-notes.md, updated with every
          # release): the update card shows the first two. It used to be one fixed sentence for every build.
          body_path: apps/android-native/release-notes.md
          make_latest: true
          files: |
            ${{ runner.temp }}/markmysteps.apk
            ${{ runner.temp }}/markmysteps.apk.sha256
