name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @markmysteps/web build

      - name: Sync Capacitor
        working-directory: apps/web
        run: pnpm exec cap sync android

      # Decode the signing keystore from a secret, if configured. When the
      # secret is absent we fall back to an (unsigned) debug build so forks
      # still get an APK.
      - name: Decode keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: apps/web/android
        env:
          MMS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MMS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MMS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MMS_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (fallback, unsigned)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: markmysteps-apk
          path: apps/web/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
